spring:
  config:
    import: optional:file:.env[.properties] # 외부에서 env 주입하는 구조 만들기 전까지는 임시로 .env 강제주입

  application:
    name: mini-project

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update # 나중에는 제대로 버전 관리 공부해보자